<!DOCTYPE html>
<html lang="en" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Route Optimizer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ── Theme Variables ── */
        :root {
            --bg-base:      #0d1117;
            --bg-surface:   #161b22;
            --bg-card:      #21262d;
            --bg-elevated:  #1c2333;
            --brand:        #3b82f6;
            --brand-hover:  #2563eb;
            --brand-glow:   rgba(59,130,246,0.25);
            --accent:       #10b981;
            --danger:       #ef4444;
            --text-primary: #e6edf3;
            --text-secondary:#8b949e;
            --text-muted:   #484f58;
            --border:       rgba(255,255,255,0.08);
            --border-hover: rgba(255,255,255,0.16);
            --shadow-lg:    0 8px 32px rgba(0,0,0,0.6);
            --transition:   all 0.25s cubic-bezier(0.4,0,0.2,1);
        }
        [data-theme="light"] {
            --bg-base:      #f0f4f8;
            --bg-surface:   #ffffff;
            --bg-card:      #ffffff;
            --bg-elevated:  #f6f8fa;
            --brand:        #0969da;
            --brand-hover:  #0550ae;
            --brand-glow:   rgba(9,105,218,0.15);
            --accent:       #1a7f37;
            --danger:       #cf222e;
            --text-primary: #1f2328;
            --text-secondary:#656d76;
            --text-muted:   #8c959f;
            --border:       rgba(31,35,40,0.15);
            --border-hover: rgba(31,35,40,0.28);
            --shadow-lg:    0 8px 32px rgba(31,35,40,0.18);
        }

        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s ease, color 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        /* Animated background grid */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        /* Glowing orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
            animation: float 8s ease-in-out infinite;
        }
        .orb-1 { width:400px; height:400px; background:rgba(59,130,246,0.12); top:-100px; left:-100px; animation-delay:0s; }
        .orb-2 { width:300px; height:300px; background:rgba(16,185,129,0.08); bottom:-80px; right:-80px; animation-delay:3s; }
        .orb-3 { width:200px; height:200px; background:rgba(168,85,247,0.08); top:50%; left:50%; animation-delay:6s; }

        @keyframes float {
            0%,100% { transform: translateY(0) scale(1); }
            50%      { transform: translateY(-20px) scale(1.05); }
        }

        /* Theme toggle */
        .theme-btn {
            position: fixed;
            top: 1.25rem;
            right: 1.25rem;
            width: 40px; height: 40px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg-surface);
            color: var(--text-secondary);
            font-size: 1.1rem;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: var(--transition);
            z-index: 100;
        }
        .theme-btn:hover { border-color: var(--brand); color: var(--brand); transform: scale(1.05); }

        /* Card */
        .auth-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: var(--shadow-lg);
            animation: slideUp 0.4s cubic-bezier(0.4,0,0.2,1);
        }

        @keyframes slideUp {
            from { opacity:0; transform:translateY(24px); }
            to   { opacity:1; transform:translateY(0); }
        }

        /* Logo */
        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
        }
        .logo-icon {
            width: 44px; height: 44px;
            background: var(--brand);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem;
            box-shadow: 0 4px 16px var(--brand-glow);
            flex-shrink: 0;
        }
        .logo-text h1 { font-size: 1.1rem; font-weight: 700; color: var(--text-primary); }
        .logo-text p  { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.1rem; }

        /* Tabs */
        .tabs {
            display: flex;
            background: var(--bg-elevated);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 1.75rem;
            border: 1px solid var(--border);
        }
        .tab-btn {
            flex: 1;
            padding: 0.6rem;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 7px;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
        }
        .tab-btn.active {
            background: var(--bg-surface);
            color: var(--text-primary);
            box-shadow: 0 1px 4px rgba(0,0,0,0.3);
        }

        /* Forms */
        .form-panel { display: none; }
        .form-panel.active { display: block; animation: fadeIn 0.25s ease; }

        @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

        .form-group { margin-bottom: 1.1rem; }

        label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
            letter-spacing: 0.02em;
        }

        .input-wrap {
            position: relative;
        }
        .input-icon {
            position: absolute;
            left: 0.85rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.9rem;
            pointer-events: none;
            opacity: 0.5;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.4rem;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.88rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: var(--transition);
        }
        input::placeholder { color: var(--text-muted); }
        input:focus {
            border-color: var(--brand);
            box-shadow: 0 0 0 3px var(--brand-glow);
        }
        input.error { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(239,68,68,0.15); }

        /* Password toggle */
        .pw-toggle {
            position: absolute;
            right: 0.85rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--text-muted);
            padding: 0;
            transition: var(--transition);
        }
        .pw-toggle:hover { color: var(--text-primary); }

        /* Remember / Forgot row */
        .form-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
        }
        .remember {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.78rem;
            color: var(--text-secondary);
            cursor: pointer;
        }
        .remember input { width: auto; padding: 0; }
        .forgot {
            font-size: 0.78rem;
            color: var(--brand);
            text-decoration: none;
            font-weight: 500;
        }
        .forgot:hover { text-decoration: underline; }

        /* Submit button */
        .btn-submit {
            width: 100%;
            padding: 0.85rem;
            background: var(--brand);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 16px var(--brand-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            letter-spacing: 0.01em;
        }
        .btn-submit:hover { background: var(--brand-hover); transform: translateY(-1px); box-shadow: 0 6px 20px var(--brand-glow); }
        .btn-submit:active { transform: translateY(0); }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin: 1.25rem 0;
            color: var(--text-muted);
            font-size: 0.75rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* Demo login */
        .demo-btn {
            width: 100%;
            padding: 0.75rem;
            background: var(--bg-elevated);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .demo-btn:hover { border-color: var(--brand); color: var(--brand); background: var(--bg-card); }

        /* Alert messages */
        .alert {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 500;
            margin-bottom: 1rem;
            display: none;
            align-items: center;
            gap: 0.5rem;
        }
        .alert.show { display: flex; animation: fadeIn 0.2s ease; }
        .alert-error   { background: rgba(239,68,68,0.1);  border: 1px solid rgba(239,68,68,0.3);  color: #f87171; }
        .alert-success { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3); color: #34d399; }

        /* Password strength */
        .pw-strength { margin-top: 0.4rem; }
        .pw-strength-bar {
            height: 3px;
            border-radius: 2px;
            background: var(--border);
            overflow: hidden;
            margin-bottom: 0.25rem;
        }
        .pw-strength-fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.3s ease, background 0.3s ease;
            width: 0%;
        }
        .pw-strength-label { font-size: 0.68rem; color: var(--text-muted); }

        /* Footer */
        .auth-footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .auth-footer a { color: var(--brand); text-decoration: none; }
        .auth-footer a:hover { text-decoration: underline; }

        /* Spinner */
        .spinner {
            width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <button class="theme-btn" id="themeBtn" title="Toggle theme">🌙</button>

    <div class="auth-card">
        <!-- Logo -->
        <div class="logo">
            <div class="logo-icon">��</div>
            <div class="logo-text">
                <h1>Route Optimizer</h1>
                <p>Punjab Logistics Dashboard</p>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" id="tabSignIn" onclick="switchTab('signin')">Sign In</button>
            <button class="tab-btn"        id="tabSignUp" onclick="switchTab('signup')">Sign Up</button>
        </div>

        <!-- Alert -->
        <div class="alert alert-error"   id="alertError">  <span>⚠️</span> <span id="alertErrorMsg"></span></div>
        <div class="alert alert-success" id="alertSuccess"><span>✅</span> <span id="alertSuccessMsg"></span></div>

        <!-- SIGN IN FORM -->
        <div class="form-panel active" id="panelSignin">
            <form id="signinForm" onsubmit="handleSignIn(event)">
                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-wrap">
                        <span class="input-icon">📧</span>
                        <input type="email" id="siEmail" placeholder="you@example.com" required autocomplete="email">
                    </div>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrap">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="siPassword" placeholder="Enter your password" required autocomplete="current-password">
                        <button type="button" class="pw-toggle" onclick="togglePw('siPassword', this)">👁️</button>
                    </div>
                </div>
                <div class="form-row">
                    <label class="remember">
                        <input type="checkbox" id="rememberMe"> Remember me
                    </label>
                    <a href="#" class="forgot" onclick="showForgot()">Forgot password?</a>
                </div>
                <button type="submit" class="btn-submit" id="signinBtn">
                    <span class="spinner" id="signinSpinner"></span>
                    <span id="signinBtnText">Sign In</span>
                </button>
            </form>

            <div class="divider">or continue with</div>
            <button class="demo-btn" onclick="fillDemo()">🎯 Use Demo Account</button>
        </div>

        <!-- SIGN UP FORM -->
        <div class="form-panel" id="panelSignup">
            <form id="signupForm" onsubmit="handleSignUp(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <div class="input-wrap">
                        <span class="input-icon">👤</span>
                        <input type="text" id="suName" placeholder="Your full name" required autocomplete="name">
                    </div>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-wrap">
                        <span class="input-icon">📧</span>
                        <input type="email" id="suEmail" placeholder="you@example.com" required autocomplete="email">
                    </div>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrap">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="suPassword" placeholder="Create a strong password" required oninput="checkStrength(this.value)" autocomplete="new-password">
                        <button type="button" class="pw-toggle" onclick="togglePw('suPassword', this)">👁️</button>
                    </div>
                    <div class="pw-strength">
                        <div class="pw-strength-bar"><div class="pw-strength-fill" id="strengthFill"></div></div>
                        <span class="pw-strength-label" id="strengthLabel">Enter a password</span>
                    </div>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <div class="input-wrap">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="suConfirm" placeholder="Repeat your password" required autocomplete="new-password">
                        <button type="button" class="pw-toggle" onclick="togglePw('suConfirm', this)">👁️</button>
                    </div>
                </div>
                <button type="submit" class="btn-submit" id="signupBtn">
                    <span class="spinner" id="signupSpinner"></span>
                    <span id="signupBtnText">Create Account</span>
                </button>
            </form>
        </div>

        <div class="auth-footer">
            By continuing you agree to our <a href="#">Terms of Service</a> &amp; <a href="#">Privacy Policy</a>
        </div>
    </div>

    <script>
        // ── Theme ──────────────────────────────────────────────────────────
        const themeBtn = document.getElementById('themeBtn');
        const root     = document.getElementById('htmlRoot');
        const saved    = localStorage.getItem('routeOptimizerTheme') || 'dark';

        const applyTheme = (t) => {
            if (t === 'light') {
                root.setAttribute('data-theme', 'light');
                themeBtn.textContent = '☀️';
            } else {
                root.removeAttribute('data-theme');
                themeBtn.textContent = '🌙';
            }
            localStorage.setItem('routeOptimizerTheme', t);
        };

        applyTheme(saved);
        themeBtn.addEventListener('click', () => {
            applyTheme(localStorage.getItem('routeOptimizerTheme') === 'light' ? 'dark' : 'light');
        });

        // ── Tab switching ──────────────────────────────────────────────────
        function switchTab(tab) {
            document.getElementById('panelSignin').classList.toggle('active', tab === 'signin');
            document.getElementById('panelSignup').classList.toggle('active', tab === 'signup');
            document.getElementById('tabSignIn').classList.toggle('active', tab === 'signin');
            document.getElementById('tabSignUp').classList.toggle('active', tab === 'signup');
            hideAlerts();
        }

        // ── Alerts ─────────────────────────────────────────────────────────
        function showError(msg)   { const a = document.getElementById('alertError');   document.getElementById('alertErrorMsg').textContent   = msg; a.classList.add('show'); }
        function showSuccess(msg) { const a = document.getElementById('alertSuccess'); document.getElementById('alertSuccessMsg').textContent = msg; a.classList.add('show'); }
        function hideAlerts()     { document.getElementById('alertError').classList.remove('show'); document.getElementById('alertSuccess').classList.remove('show'); }

        // ── Password toggle ────────────────────────────────────────────────
        function togglePw(id, btn) {
            const inp = document.getElementById(id);
            if (inp.type === 'password') { inp.type = 'text';     btn.textContent = '🙈'; }
            else                         { inp.type = 'password'; btn.textContent = '👁️'; }
        }

        // ── Password strength ──────────────────────────────────────────────
        function checkStrength(val) {
            const fill  = document.getElementById('strengthFill');
            const label = document.getElementById('strengthLabel');
            let score = 0;
            if (val.length >= 8)          score++;
            if (/[A-Z]/.test(val))        score++;
            if (/[0-9]/.test(val))        score++;
            if (/[^A-Za-z0-9]/.test(val)) score++;
            const levels = [
                { pct: '0%',   color: '#ef4444', text: 'Too short' },
                { pct: '25%',  color: '#ef4444', text: 'Weak' },
                { pct: '50%',  color: '#f59e0b', text: 'Fair' },
                { pct: '75%',  color: '#3b82f6', text: 'Good' },
                { pct: '100%', color: '#10b981', text: 'Strong 💪' },
            ];
            const l = levels[val.length === 0 ? 0 : score];
            fill.style.width    = l.pct;
            fill.style.background = l.color;
            label.textContent   = l.text;
            label.style.color   = l.color;
        }

        // ── Demo fill ──────────────────────────────────────────────────────
        function fillDemo() {
            document.getElementById('siEmail').value    = 'demo@routeoptimizer.com';
            document.getElementById('siPassword').value = 'Demo@1234';
            hideAlerts();
        }

        // ── Forgot password ────────────────────────────────────────────────
        function showForgot() {
            showSuccess('Password reset link sent! Check your email.');
        }

        // ── Loading state ──────────────────────────────────────────────────
        function setLoading(formType, loading) {
            const btn      = document.getElementById(formType + 'Btn');
            const spinner  = document.getElementById(formType + 'Spinner');
            const btnText  = document.getElementById(formType + 'BtnText');
            btn.disabled         = loading;
            spinner.style.display = loading ? 'block' : 'none';
            btnText.textContent  = loading
                ? (formType === 'signin' ? 'Signing in...' : 'Creating account...')
                : (formType === 'signin' ? 'Sign In' : 'Create Account');
        }

        // ── Sign In ────────────────────────────────────────────────────────
        async function handleSignIn(e) {
            e.preventDefault();
            hideAlerts();
            const email    = document.getElementById('siEmail').value.trim();
            const password = document.getElementById('siPassword').value;
            const remember = document.getElementById('rememberMe').checked;

            setLoading('signin', true);
            try {
                const res  = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, remember })
                });
                const data = await res.json();
                if (res.ok) {
                    showSuccess('Welcome back! Redirecting...');
                    setTimeout(() => window.location.href = '/', 800);
                } else {
                    showError(data.error || 'Invalid email or password.');
                }
            } catch {
                showError('Network error. Please try again.');
            } finally {
                setLoading('signin', false);
            }
        }

        // ── Sign Up ────────────────────────────────────────────────────────
        async function handleSignUp(e) {
            e.preventDefault();
            hideAlerts();
            const name     = document.getElementById('suName').value.trim();
            const email    = document.getElementById('suEmail').value.trim();
            const password = document.getElementById('suPassword').value;
            const confirm  = document.getElementById('suConfirm').value;

            if (password !== confirm) { showError('Passwords do not match.'); return; }
            if (password.length < 6)  { showError('Password must be at least 6 characters.'); return; }

            setLoading('signup', true);
            try {
                const res  = await fetch('/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });
                const data = await res.json();
                if (res.ok) {
                    showSuccess('Account created! Signing you in...');
                    setTimeout(() => window.location.href = '/', 900);
                } else {
                    showError(data.error || 'Registration failed.');
                }
            } catch {
                showError('Network error. Please try again.');
            } finally {
                setLoading('signup', false);
            }
        }
    </script>
</body>
</html>
